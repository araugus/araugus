name: uplift-marketing-campaign

on:
  push:
    paths:
      - "projects/uplift-marketing-campaign/**"
      - ".github/workflows/uplift-marketing-campaign.yml"
  pull_request:
    paths:
      - "projects/uplift-marketing-campaign/**"
      - ".github/workflows/uplift-marketing-campaign.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/uplift-marketing-campaign
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/uplift-marketing-campaign/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.17.0
          pip install -e .
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest -q
