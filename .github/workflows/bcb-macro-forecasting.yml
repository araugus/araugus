name: bcb-macro-forecasting

on:
  push:
    paths:
      - "projects/bcb-macro-forecasting/**"
      - ".github/workflows/bcb-macro-forecasting.yml"
  pull_request:
    paths:
      - "projects/bcb-macro-forecasting/**"
      - ".github/workflows/bcb-macro-forecasting.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/bcb-macro-forecasting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/bcb-macro-forecasting/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Test (no network)
        run: pytest -q
